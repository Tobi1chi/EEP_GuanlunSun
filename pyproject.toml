[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eep-remote"
version = "0.1.0"
description = "EEP simulation package and published experiment outputs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyomo==6.10.0",
  "highspy==1.13.1",
  "matplotlib==3.10.8",
]

[tool.setuptools]
package-dir = {"" = "sim/src"}

[tool.setuptools.packages.find]
where = ["sim/src"]
